name: Clang Sanitizer

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/sanitize.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      cmakeextra:
        description: "Extra CMake options"
        required: false
        default: ""
      sanitizer:
        description: 'Sanitizer to run'
        required: true
        default: 'address'
        # caution: memory sanitizer is currently broken with Catch
        options: ['address', 'thread', 'memory', 'undefined', 'address,undefined']
        type: choice

defaults:
  run:
    shell: bash

env:
  ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/testing/tsan.supp

jobs:
  build:
    name: "${{ matrix.sanitizer }}"
    runs-on: 'ubuntu-24.04'
    # ponytail: non-blocking until dev is clean (#312, #314); then drop this and make the job required
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.sanitizer)) || fromJSON('["address,undefined", "thread"]') }}

    steps:
      - uses: actions/checkout@v4
      - name: Install build toolchain
        run: |
          sudo apt update
          sudo apt install -y libpugixml-dev clang-18
          # newer runner kernels use more mmap randomization than the sanitizers' fixed shadow layouts allow
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure CMake
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          # -fsanitize=function (part of "undefined" since clang 17) flags every C API call through a
          # function pointer: headers declare opaque handle types, the library defines the same
          # functions with internal ones (src/api_types.hpp). Same ABI, intentional, so skip it.
          flags="-fsanitize=$SANITIZER -fno-omit-frame-pointer"
          if [[ "$SANITIZER" == *undefined* ]]; then flags="$flags -fno-sanitize=function"; fi
          cmake --version
          cmake -S . -B build \
               -DCMAKE_BUILD_TYPE=RelWithDebInfo \
               -DCMAKE_C_COMPILER=clang-18 \
               -DCMAKE_{CXX_COMPILER,LINKER}=clang++-18 \
               -DCMAKE_{C,CXX,EXE_LINKER,SHARED_LINKER}_FLAGS="$flags" \
               -DLSL_COMFY_DEFAULTS=ON \
               -DLSL_UNITTESTS=ON \
               -DLSL_BENCHMARKS=ON \
               -DLSL_BUILD_EXAMPLES=OFF \
               -DLSL_BUNDLED_PUGIXML=OFF \
               -DLSL_SLIMARCHIVE=ON \
               -DLSL_OPTIMIZATIONS=ON \
               -Dlslgitrevision=${{ github.sha }} \
               -Dlslgitbranch=${{ github.ref }} \
               ${{ github.event.inputs.cmakeextra }}
           echo ${PWD}

      - name: make
        # only the tests: C programs like lslver can't link against a ubsan-instrumented C++ library
        run: cmake --build build --config RelWithDebInfo -j --target lsl_test_internal lsl_test_exported

      - name: run unit tests
        # not under gdb: LeakSanitizer refuses to run under ptrace, and the sanitizers print their own stacks
        run: |
          build/testing/lsl_test_internal --order rand --wait-for-keypress never --durations yes --skip-benchmarks
          build/testing/lsl_test_exported --order rand --wait-for-keypress never --durations yes --skip-benchmarks
        timeout-minutes: 30
