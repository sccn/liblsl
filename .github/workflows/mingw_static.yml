name: MinGW Windows

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/mingw_static.yml'
  pull_request:
  release:
    types: ['published']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_skip:
    name: Skip if already tested
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - id: skip
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          # Only skip pushes whose exact file tree already passed (e.g. a merged PR)
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule", "release"]'
          skip_after_successful_duplicate: 'true'
          concurrent_skipping: 'never'

  build:
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    name: MinGW ${{ matrix.msys }} ${{ matrix.lib_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs_on: windows-latest, msys: ucrt64,     lib_type: DLL }
          - { runs_on: windows-latest, msys: ucrt64,     lib_type: static }
          - { runs_on: windows-11-arm, msys: clangarm64, lib_type: DLL }
          - { runs_on: windows-11-arm, msys: clangarm64, lib_type: static }
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys }}
        update: true
        cache: true
        install: git
        pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
    - name: Configure CMake
      run: |
           cmake --version
           cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=${PWD}/install \
                -DLSL_UNITTESTS=ON \
                -DLSL_BUILD_STATIC=${{ matrix.lib_type == 'static' && 'ON' || 'OFF' }} \
                -Dlslgitrevision=${{ github.sha }} \
                -Dlslgitbranch=${{ github.ref }} \
                -DLSL_OPTIMIZATIONS=OFF \
                -G Ninja

    - name: make
      run: cmake --build build --target install --config Release -j --verbose

    - name: upload install dir
      uses: actions/upload-artifact@v7
      with:
        name: mingw-${{ matrix.msys }}-${{ matrix.lib_type }}
        path: install

    # The unit tests crash on clangarm64 in asio's thread_local call stack: an LLVM-MinGW
    # aarch64 TLS limitation, not a liblsl bug (see the analysis in sccn/liblsl#274).
    # The library itself works as a dependency there; revisit as the toolchain matures.
    - name: unit tests (internal functions)
      if: matrix.msys != 'clangarm64'
      run: 'install/bin/lsl_test_internal --order rand --wait-for-keypress never --durations yes'
      timeout-minutes: 5

    - name: unit tests (exported functions)
      if: matrix.msys != 'clangarm64'
      run: install/bin/lsl_test_exported --wait-for-keypress never --durations yes
      timeout-minutes: 5

  release:
    name: Upload MinGW release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: mingw-*
    - name: Zip install trees
      run: |
        version="${GITHUB_REF_NAME#v}"
        for dir in mingw-*; do
          (cd "$dir" && zip -qr "../liblsl-${version}-MinGW-${dir#mingw-}.zip" .)
        done
        ls -l *.zip
    - uses: softprops/action-gh-release@v3
      with:
        files: liblsl-*-MinGW-*.zip
